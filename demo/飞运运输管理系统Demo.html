<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>飞育教育管理系统 · 离线演示</title>
<style>
/* 飞育教育管理系统 · 样式 */
:root {
  --pri: #ea580c;
  --pri-d: #16389f;
  --bg: #f4f6fb;
  --card: #fff;
  --line: #e3e8f2;
  --txt: #1a2333;
  --sub: #7684a0;
  --ok: #16a34a;
  --warn: #d99b0b;
  --err: #cf2f4b;
  --side: #101a33;
  --side-2: #1b2b52;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--txt);
  background: var(--bg);
  overflow-x: hidden;
}
a { color: var(--pri); text-decoration: none; }

/* ---------- 侧边栏 ---------- */
#sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 200px;
  background: var(--side); color: #c5cfdf; display: flex; flex-direction: column;
  z-index: 20;
}
.brand {
  padding: 18px 18px 4px; font-size: 18px; font-weight: 700; color: #fff;
  letter-spacing: 1px;
}
.brand-sub { padding: 0 18px 14px; font-size: 11.5px; color: #7d8aa5; }
#nav { flex: 1; overflow-y: auto; padding: 4px 8px; }
#nav a {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px; margin: 1px 0;
  color: #b9c5da; border-radius: 7px; font-size: 13.5px; position: relative;
}
#nav a .ic { width: 18px; text-align: center; font-size: 14px; }
#nav a:hover { background: var(--side-2); color: #fff; }
#nav a.on { background: var(--pri); color: #fff; }
#nav a .badge {
  margin-left: auto; background: var(--err); color: #fff; font-size: 11px;
  min-width: 18px; height: 18px; line-height: 18px; text-align: center;
  border-radius: 9px; padding: 0 5px; font-weight: 600;
}
#nav a.on .badge { background: rgba(255,255,255,.28); }
.side-foot {
  padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.08);
  font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.side-foot span { color: #8ba3a6; flex: 1; min-width: 80px; }

/* ---------- 主区 ---------- */
#main {
  margin-left: 200px; padding: 20px 24px 48px; min-height: 100vh;
}
h2.page { font-size: 19px; margin: 0 0 4px; font-weight: 650; }
.page-desc { color: var(--sub); font-size: 12.5px; margin-bottom: 14px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 14px;
}
.card h3 {
  margin: 0 0 12px; font-size: 14.5px; font-weight: 650; display: flex;
  align-items: center; gap: 8px;
}
.card h3 .sub { font-weight: 400; font-size: 12px; color: var(--sub); margin-left: auto; }

/* ---------- KPI ---------- */
.kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 18px; min-width: 130px; flex: 1;
}
.kpi b { display: block; font-size: 23px; font-weight: 700; line-height: 1.25; }
.kpi span { font-size: 12.5px; color: var(--sub); }
.kpi.ok b { color: var(--ok); }
.kpi.warn b { color: var(--warn); }
.kpi.err b { color: var(--err); }
.kpi.pri b { color: var(--pri); }

/* ---------- 工具条 ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.btn {
  border: 0; background: var(--pri); color: #fff; padding: 7px 14px;
  border-radius: 7px; font-size: 13px; cursor: pointer; font-family: inherit;
  transition: background .15s;
}
.btn:hover { background: var(--pri-d); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.ghost { background: #eaf0f1; color: var(--txt); }
.btn.ghost:hover { background: #dfe8e9; }
.btn.danger { background: var(--err); }
.btn.ok { background: var(--ok); }
.btn.sm { padding: 4px 10px; font-size: 12px; }

input, select, textarea {
  font-family: inherit; font-size: 13px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 7px; background: #fff;
  color: var(--txt); outline: none; max-width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--pri); }
textarea { resize: vertical; min-height: 84px; width: 100%; }

/* ---------- 表格 ---------- */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th { color: var(--sub); font-weight: 600; font-size: 12.5px; background: #f9fbfb; }
tbody tr:hover { background: #f6faf9; }
tr.click { cursor: pointer; }
td.wrap { white-space: normal; min-width: 180px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.tag {
  display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
  background: #eaf0f1; color: var(--sub);
}
.tag.ok { background: #e6f7ec; color: var(--ok); }
.tag.warn { background: #fff5e0; color: var(--warn); }
.tag.err { background: #fdedf0; color: var(--err); }
.tag.pri { background: #e3f4f2; color: var(--pri); }

.empty { color: var(--sub); text-align: center; padding: 44px 12px; font-size: 13px; }

/* ---------- 表单 ---------- */
.fld { display: block; margin-bottom: 12px; }
.fld > span { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; }
.fld input, .fld select, .fld textarea { width: 100%; }
.fld i { display: block; font-size: 11.5px; color: var(--sub); font-style: normal; margin-top: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }

/* ---------- 进度条 ---------- */
.bar { background: #eaf0f1; border-radius: 5px; height: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pri); border-radius: 5px; }
.bar i.warn { background: var(--warn); }
.bar i.err { background: var(--err); }
.bar i.ok { background: var(--ok); }

/* ---------- 竖向柱状图 ---------- */
.chart { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding: 6px 0 0; }
.chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
  align-items: center; gap: 4px; min-width: 0; }
.chart .col .bars { display: flex; gap: 3px; align-items: flex-end; height: 150px; }
.chart .col .bars i { width: 14px; border-radius: 3px 3px 0 0; background: var(--pri);
  display: block; min-height: 2px; }
.chart .col .bars i.b2 { background: #9ecfc9; }
.chart .col .lb { font-size: 11.5px; color: var(--sub); white-space: nowrap; }
.chart .col .vv { font-size: 11px; color: var(--txt); }

/* ---------- 横向条形排行 ---------- */
.rank { display: flex; flex-direction: column; gap: 9px; }
.rank .r { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.rank .r .n { width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .r .b { flex: 1; }
.rank .r .v { width: 96px; text-align: right; color: var(--sub);
  font-variant-numeric: tabular-nums; }

/* ---------- 时间线 ---------- */
.tl { position: relative; padding-left: 22px; }
.tl:before {
  content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px;
  width: 2px; background: var(--line);
}
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item:before {
  content: ''; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px;
  border-radius: 50%; background: #fff; border: 2px solid var(--pri);
}
.tl-item.pass:before { border-color: var(--ok); }
.tl-item.reject:before { border-color: var(--err); }
.tl-item .t { font-size: 11.5px; color: var(--sub); }
.tl-item .h { font-weight: 600; font-size: 13.5px; margin: 1px 0; }
.tl-item .d { color: var(--sub); font-size: 12.5px; }

/* ---------- 风险卡片 ---------- */
.risk-list { display: flex; flex-direction: column; gap: 10px; }
.risk-item {
  background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--warn);
  border-radius: 9px; padding: 12px 16px;
}
.risk-item.lv-hi { border-left-color: var(--err); }
.risk-item.lv-mid { border-left-color: var(--warn); }
.risk-item.lv-lo { border-left-color: #9ecfc9; }
.risk-item .h { display: flex; align-items: center; gap: 8px; }
.risk-item .h b { font-size: 13.5px; }
.risk-item .d { color: var(--sub); font-size: 12.5px; margin: 4px 0 0; }

/* ---------- 税率卡 ---------- */
.rate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.rate-card {
  border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; background: #fff;
}
.rate-card b { display: block; font-size: 20px; color: var(--pri); }
.rate-card span { font-size: 12px; color: var(--sub); }

/* ---------- 弹层 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 28, 30, .45); z-index: 60;
  display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px;
  overflow-y: auto;
}
.modal {
  background: #fff; border-radius: 12px; padding: 20px 22px; width: 520px;
  max-width: 100%; box-shadow: 0 16px 48px rgba(0,0,0,.22);
}
.modal.wide { width: 800px; }
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.hidden { display: none !important; }

.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
  background: #1a2333; color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; z-index: 90; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  max-width: 80vw;
}

/* ---------- 结算卡 ---------- */
.settle {
  background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff;
  border-radius: 10px; padding: 16px 20px; margin-bottom: 14px;
}
.settle .row { display: flex; gap: 26px; flex-wrap: wrap; }
.settle .row > div b { display: block; font-size: 21px; font-weight: 700; }
.settle .row > div span { font-size: 12px; opacity: .82; }
.settle .note { margin-top: 10px; font-size: 12px; opacity: .85; }

/* ---------- 登录页 ---------- */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #101a33 0%, #1e3a8a 52%, #1d4ed8 130%);
  padding: 20px;
}
.login-box {
  background: #fff; border-radius: 14px; padding: 34px 32px; width: 372px;
  max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.login-box h1 { font-size: 21px; margin: 0 0 4px; }
.login-box p { color: var(--sub); font-size: 12.5px; margin: 0 0 22px; }
.login-box input { width: 100%; margin-bottom: 12px; padding: 10px 12px; }
.login-box .btn { width: 100%; padding: 10px; font-size: 14px; margin-top: 6px; }
.hint { font-size: 11.5px; color: var(--sub); text-align: center; margin-top: 14px;
  line-height: 1.8; }

/* ---------- 移动端 ---------- */
@media (max-width: 820px) {
  #sidebar {
    position: static; width: auto; flex-direction: row; align-items: center;
    overflow-x: auto; padding: 0 8px;
  }
  .brand { padding: 10px 8px; font-size: 15px; white-space: nowrap; }
  .brand-sub { display: none; }
  #nav { display: flex; padding: 6px 0; flex: 1; }
  #nav a { white-space: nowrap; padding: 6px 10px; }
  #nav a .ic { display: none; }
  .side-foot { border: 0; padding: 6px; }
  .side-foot span { display: none; }
  #main { margin-left: 0; padding: 14px 12px 40px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .kpi b { font-size: 20px; }
  .chart { height: 160px; }
  .chart .col .bars { height: 120px; }
}

/* ---------- 飞育扩展 ---------- */
.sub-cell { font-size: 12px; color: var(--sub); max-width: 280px; white-space: normal; }
.rowitem { padding: 8px 4px; border-bottom: 1px dashed var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.rowitem.hot b { color: var(--err); }
.rowitem i { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--sub); }
.rowitem p { width: 100%; margin: 2px 0 0; font-size: 12.5px; color: var(--sub); }
table.week th { text-align: center; padding: 6px 4px; font-size: 12.5px; }
table.week td { border: 1px solid var(--line); padding: 3px; vertical-align: top; height: 46px; }
.slot b { display: block; font-size: 12px; color: var(--pri); }
.slot i { font-style: normal; font-size: 11px; color: var(--sub); }
.card.hot { border-color: #f3c1cb; background: #fff7f8; }
select, input[type=number] { margin-left: 6px; }


.demo-bar{position:fixed;left:0;right:0;top:0;z-index:99;background:#fff8e6;color:#7a5b12;
  border-bottom:1px solid #f0d9a8;font-size:12.5px;padding:7px 16px;text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.demo-bar b{color:#b8791b}
.demo-bar .who{margin-left:12px;padding-left:12px;border-left:1px solid #f0d9a8}
.demo-bar select{font-size:12.5px;padding:2px 6px;border:1px solid #e0c98f;border-radius:4px;
  background:#fff;color:#7a5b12}
body{padding-top:34px}

</style>
</head>

      }).catch(function () {});
    }
  }).catch(function (e) {
    if (e.message !== 'unauth') location.href = 'login.html';
  });

var CUR = null;
function go(key) {
  CUR = key;
  if (location.hash !== '#/' + key) location.hash = '#/' + key;
  document.querySelectorAll('#nav a').forEach(function (a) {
    a.classList.toggle('on', a.getAttribute('data-k') === key);
  });
  var main = document.getElementById('main');
  main.innerHTML = '<div class="empty">加载中…</div>';
  var task;
  try {
    task = PAGES[key](main);
  } catch (e) {
    task = Promise.reject(e);
  }
  Promise.resolve(task).catch(function (e) {
    if (e && e.message === 'unauth') return;
    main.innerHTML = '<div class="empty">加载失败：' + esc(e && e.message) + '</div>';
  });
}

function modal(html, wide) {
  var mask = document.getElementById('modal-mask');
  var box = document.getElementById('modal');
  box.innerHTML = html;
  box.className = 'modal' + (wide ? ' wide' : '');
  mask.classList.remove('hidden');
  mask.onclick = function (e) { if (e.target === mask) closeModal(); };
}
function closeModal() {
  document.getElementById('modal-mask').classList.add('hidden');
}

function table(headers, rows, rowHtml, empty) {
  if (!rows || !rows.length) return '<div class="empty">' + (empty || '暂无数据') + '</div>';
  return '<div class="tw"><table><thead><tr>' + headers.map(function (h) {
    if (h && h.charAt(0) === '~') return '<th class="num">' + h.slice(1) + '</th>';
    return '<th>' + h + '</th>';
  }).join('') + '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table></div>';
}

function tag(text, cls) {
  return '<span class="tag ' + (cls || '') + '">' + esc(text) + '</span>';
}
function statusTag(s) {
  var m = {'在读': 'ok', '已缴清': 'ok', '已审批': 'ok', '已处理': 'ok',
           '启用': 'ok', '在职': 'ok', '开课': 'ok', '出勤': 'ok',
           '待审批': 'warn', '待缴': 'warn', '部分缴费': 'warn', '迟到': 'warn',
           '休学': '', '已驳回': 'err', '退学': 'err', '转出': 'err', '旷课': 'err',
           '病假': 'warn', '事假': 'warn', '待处理': 'err'};
  return tag(s, m[s] || '');
}
function levelTag(l) {
  var m = {'险': 'err', '警': 'warn', '提': 'pri'};
  return tag(l, m[l] || '');
}
function level2(l) {

}
function kpi(v, label, cls) {
  return '<div class="kpi ' + (cls || '') + '"><b>' + esc(v) + '</b><span>' + esc(label) + '</span></div>';
}
function field(label, input, hint) {
  return '<label class="fld"><span>' + esc(label) + '</span>' + input +
    (hint ? '<i>' + esc(hint) + '</i>' : '') + '</label>';
}
function bar(pct, cls) {
  var w = Math.max(0, Math.min(100, pct));
  return '<div class="bar"><i class="' + (cls || '') + '" style="width:' + w + '%"></i></div>';
}
function dl(p, name) {
  CSV(p).then(function (t) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], {type: 'text/csv;charset=utf-8'}));
    a.download = name || 'export.csv';
    a.click();
  }).catch(function (e) { toast(e.message, true); });
}

/* 通用列表请求（?kw= 等） */
function qs(o) {
  var k = Object.keys(o || {}).filter(function (x) { return o[x]; });
  if (!k.length) return '';
  return '?' + k.map(function (x) { return x + '=' + encodeURIComponent(o[x]); }).join('&');
}

            '</td><td>' + esc(d.license_no || '—') + '</td><td>' + esc(d.license_type || '—') +
            '</td><td>' + esc(d.license_exp || '—') + '</td><td class="num">' + d.total_trips +
            '</td><td class="num">' + fmtWan(d.total_km) + ' km</td><td>' + stTag(d.status) + '</td></tr>';
        });
    });
  }
  document.getElementById('btn-new').onclick = function () {
    modal('<h3>新建司机</h3>' +
      field('姓名', '<input id="m-name">') +
      field('手机', '<input id="m-phone">') +
      field('驾照号', '<input id="m-lno">') +
      field('驾照类型', '<select id="m-lt"><option>A2</option><option>B2</option><option>C1</option></select>') +
      field('驾照到期', '<input id="m-exp" type="date">') +
      '<div class="m-foot"><button class="btn pri" id="m-ok">创建</button></div>');
    document.getElementById('m-ok').onclick = function () {
      POST('/api/drivers', {
        name: document.getElementById('m-name').value.trim(),
        phone: document.getElementById('m-phone').value,
        license_no: document.getElementById('m-lno').value,
        license_type: document.getElementById('m-lt').value,
        license_exp: document.getElementById('m-exp').value || null
      }).then(function () { toast('司机已创建'); closeModal(); load(); })
        .catch(function (e) { toast(e.message, true); });
    };
  };
  return load();
};

/* ---------- 线路 ---------- */
PAGES.route = function (main) {

      '<div class="m-foot"><button class="btn pri" id="m-ok">创建</button></div>');

      }).then(function () { toast('线路已创建'); closeModal(); load(); })
        .catch(function (e) { toast(e.message, true); });

};

/* ---------- 结算 ---------- */
PAGES.settle = function (main) {
  main.innerHTML = '<h2>财务结算</h2><div id="sum"></div>' +
    '<div class="toolbar"><select id="f-status"><option value="">全部</option>' +
    '<option value="open">待结</option><option value="closed">已结</option></select>' +
    '<button class="btn sm" id="f-go">查询</button>' +
    '<button class="btn sm ghost" id="btn-csv">导出CSV</button></div><div id="list"></div>';
  function load() {
    return Promise.all([
      GET('/api/settlements' + qs({status: document.getElementById('f-status').value})),
      GET('/api/settlements/summary')
    ]).then(function (rs) {
      var s = rs[1].data;
      document.getElementById('sum').innerHTML = '<div class="kpis">' +
        kpi('¥' + fmtWan(s.open_receivable), '应收(待结)', 'warn') +
        kpi('¥' + fmtWan(s.open_payable), '应付(待结)') +
        kpi('¥' + fmtWan(s.total_profit), '累计毛利', 'ok') +
        kpi(fmtPct(s.closed_ratio * 100, 1), '结清率') + '</div>';
      document.getElementById('list').innerHTML = table(
        ['运单号', '~收入(分)', '~油耗(分)', '~路桥(分)', '~司机应付(分)', '~毛利(分)', '状态', '操作'], rs[0].data.items, function (t) {
          var op = '';
          if (t.status === 'open' && (perm('tms.settlement.write') || perm('*')))
            op = '<a href="javascript:void(0)" data-id="' + t.id + '">结清</a>';
          return '<tr><td>' + esc(t.waybill_no || t.id) + '</td><td class="num">' + t.revenue +
            '</td><td class="num">' + t.fuel + '</td><td class="num">' + t.tolls +
            '</td><td class="num">' + t.driver_pay + '</td><td class="num"><b>' + t.profit + '</b></td><td>' +
            stTag(t.status) + '</td><td class="ops">' + op + '</td></tr>';
        });
      document.getElementById('list').onclick = function (e) {
        var a = e.target.closest('a'); if (!a) return;
        POST('/api/settlements/' + a.getAttribute('data-id') + '/close')
          .then(function () { toast('已结清'); load(); })
          .catch(function (e) { toast(e.message, true); });
      };
    });
  }
  document.getElementById('f-go').onclick = load;
  document.getElementById('f-status').onchange = load;
  document.getElementById('btn-csv').onclick = function () { dl('/api/settlements/export', 'settlements.csv'); };
  return load();
};

/* ---------- 油耗 ---------- */
PAGES.fuel = function (main) {
  main.innerHTML = '<h2>油耗管理</h2>' +
    '<div class="toolbar"><select id="f-veh"><option value="">全部车辆</option></select>' +
    '<button class="btn sm pri" id="btn-new">登记加油</button></div><div id="list"></div>';
  GET('/api/vehicles?size=100').then(function (r) {
    document.getElementById('f-veh').innerHTML += r.data.items.map(function (v) {
      return '<option value="' + v.id + '">' + esc(v.plate) + '</option>'; }).join('');
  });
  function load() {
    return GET('/api/fuel' + qs({vehicle_id: document.getElementById('f-veh').value})).then(function (r) {
      document.getElementById('list').innerHTML = table(
        ['日期', '车牌', '~升数', '~单价', '~金额(分)', '~里程表'], r.data.items, function (f) {
          return '<tr><td>' + esc(f.date) + '</td><td>' + esc(f.plate) + '</td><td class="num">' + f.liters +
            '</td><td class="num">' + f.price + '</td><td class="num">' + f.amount +
            '</td><td class="num">' + fmtWan(f.odometer) + ' km</td></tr>';
        });
    });
  }
  document.getElementById('f-veh').onchange = load;
  document.getElementById('btn-new').onclick = function () {
    modal('<h3>登记加油</h3>' +
      field('车辆', '<select id="m-veh">' + document.getElementById('f-veh').innerHTML + '</select>') +
      field('日期', '<input id="m-date" type="date" value="' + todayStr() + '">') +
      field('升数', '<input id="m-l" type="number" value="200">') +
      field('单价(元/L)', '<input id="m-p" type="number" step="0.01" value="7.9">') +
      field('里程表(km)', '<input id="m-o" type="number" value="0">') +
      '<div class="m-foot"><button class="btn pri" id="m-ok">保存</button></div>');
    document.getElementById('m-ok').onclick = function () {
      POST('/api/fuel', {
        vehicle_id: +document.getElementById('m-veh').value,
        date: document.getElementById('m-date').value,
        liters: +document.getElementById('m-l').value || 0,
        price: +document.getElementById('m-p').value || 0,
        odometer: +document.getElementById('m-o').value || 0
      }).then(function () { toast('已登记'); closeModal(); load(); })
        .catch(function (e) { toast(e.message, true); });
    };
  };
  return load();
};

/* ---------- 风险 ---------- */
PAGES.risk = function (main) {
  main.innerHTML = '<h2>风险预警</h2>' +
    '<div class="toolbar"><button class="btn sm" id="btn-scan">立即扫描</button></div><div id="list"></div>';
  function load() {
    return GET('/api/risks').then(function (r) {
      document.getElementById('list').innerHTML = table(
        ['类型', '标题', '详情', '~评分', '状态', '处理'], r.data.items, function (t) {
          var m = {'waybill_overdue': '运单逾期', 'vehicle_maint': '车辆维保', 'vehicle_ins': '车辆保险',
                   'driver_license': '驾照到期', 'client_credit': '客户欠款'};
          return '<tr><td>' + esc(m[t.rtype] || t.rtype) + '</td><td>' + esc(t.title) + '</td><td>' +
            esc(t.detail || '') + '</td><td class="num">' + levelTag(t.score >= 60 ? '险' : t.score >= 35 ? '警' : t.score > 0 ? '提' : '正常') +
            ' ' + t.score + '</td><td>' + stTag(t.status) + '</td><td class="ops">' +
            (t.status === 'open' ? '<a href="javascript:void(0)" data-id="' + t.id + '">处理</a>' : esc(t.resolved_by || '')) + '</td></tr>';
        });
      document.getElementById('list').onclick = function (e) {
        var a = e.target.closest('a'); if (!a) return;
        PUT('/api/risks/' + a.getAttribute('data-id') + '/resolve', {note: '已人工确认'})
          .then(function () { toast('已处理'); load(); })
          .catch(function (e) { toast(e.message, true); });
      };
    });
  }
  document.getElementById('btn-scan').onclick = function () {
    POST('/api/risks/scan').then(function (r) { toast('扫描完成，新增 ' + r.data.new_risks + ' 条'); load(); })
      .catch(function (e) { toast(e.message, true); });
  };
  return load();
};

/* ---------- 系统 ---------- */
PAGES.system = function (main) {
  main.innerHTML = '<h2>系统管理</h2>' +
    '<div class="tabs"><button class="btn sm on" data-t="users">用户</button>' +
    '<button class="btn sm" data-t="keys">API Key</button>' +
    '<button class="btn sm" data-t="notices">公告</button>' +
    '<button class="btn sm" data-t="logs">审计日志</button></div><div id="pane"></div>';
  var cur = 'users';
  function loadPane() {
    var pane = document.getElementById('pane');
    if (cur === 'users') {
      return GET('/api/users').then(function (r) {
        pane.innerHTML = table(['ID', '用户名', '姓名', '角色', '状态', '创建时间'], r.data.items, function (u) {
          var rm = {'admin': '管理员', 'dispatcher': '调度', 'ops': '运营', 'finance': '财务', 'captain': '车队长', 'reader': '查看'};
          return '<tr><td>' + u.id + '</td><td>' + esc(u.username) + '</td><td>' + esc(u.name || '') +
            '</td><td>' + esc(rm[u.role] || u.role) + '</td><td>' + (u.status ? tag('启用', 'ok') : tag('停用', 'err')) +
            '</td><td>' + esc(String(u.created_at).slice(0, 16)) + '</td></tr>';
        });
      });
    }
    if (cur === 'keys') {
      return GET('/api/api-keys').then(function (r) {
        pane.innerHTML = '<div class="toolbar"><button class="btn sm pri" id="btn-key">生成 API Key</button></div>' +
          table(['ID', '名称', '前缀', '权限', '状态', '最近使用'], r.data.items, function (k) {
            return '<tr><td>' + k.id + '</td><td>' + esc(k.name) + '</td><td>' + esc(k.prefix || '') +
              '</td><td>' + esc(k.perms) + '</td><td>' + (k.status ? tag('有效', 'ok') : tag('已吊销', 'err')) +
              '</td><td>' + esc(k.last_used || '—') + '</td></tr>';
          });
        document.getElementById('btn-key').onclick = function () {
          POST('/api/api-keys', {name: 'key-' + Date.now()}).then(function (r2) {
            modal('<h3>API Key 已生成</h3><p style="word-break:break-all"><b>' + esc(r2.data.key) +
              '</b></p><p class="hint" style="color:var(--sub)">仅此一次显示明文，请立即保存。</p>' +
              '<div class="m-foot"><button class="btn pri" onclick="closeModal()">知道了</button></div>');
            loadPane();
          });
        };
      });
    }
    if (cur === 'notices') {
      return GET('/api/notices').then(function (r) {
        pane.innerHTML = table(['标题', '内容', '级别', '时间'], r.data.items, function (n) {
          return '<tr><td>' + esc(n.title) + '</td><td>' + esc(n.content || '') + '</td><td>' +
            esc(n.level) + '</td><td>' + esc(String(n.created_at).slice(0, 16)) + '</td></tr>';
        });
      });
    }
    return GET('/api/logs').then(function (r) {
      pane.innerHTML = table(['时间', '用户ID', '动作', '详情', 'IP'], r.data.items.slice(0, 100), function (l) {
        return '<tr><td>' + esc(l.ts) + '</td><td>' + (l.user_id || '—') + '</td><td>' + esc(l.action) +
          '</td><td>' + esc(l.detail || '') + '</td><td>' + esc(l.ip || '') + '</td></tr>';
      });
    });
  }
  main.querySelector('.tabs').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cur = b.getAttribute('data-t');
    main.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    loadPane();
  };
  return loadPane();
};

/* PUT 支持 */
function PUT(p, b) { return api('PUT', p, b); }

</script>
<script>boot();</script>
</body>
